name: rag-lab
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    REDIS_URL: redis://redis:6379/0
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_PASSWORD: lab-password
    API_TOKEN: lab-token
    LLM_PROVIDER: mock
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    neo4j: {condition: service_healthy}
services:
  api:
    <<: *app
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U rag"], interval: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  neo4j:
    image: neo4j:5-community
    environment: {NEO4J_AUTH: neo4j/lab-password}
    healthcheck: {test: ["CMD-SHELL", "cypher-shell -u neo4j -p lab-password 'RETURN 1'"], interval: 5s, retries: 30}
